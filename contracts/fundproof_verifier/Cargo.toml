[package]
name = "fundproof_verifier"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23.0.0"
ark-groth16 = { version = "0.4.0", default-features = false }
ark-bn254 = { version = "0.4.0", default-features = false, features = ["curve"] }

[dev_dependencies]
soroban-sdk = { version = "23.0.0", features = ["testutils"] }

[build-dependencies]
serde_json = "1.0.121"
soroban-groth16-verifier = "23.0.0"